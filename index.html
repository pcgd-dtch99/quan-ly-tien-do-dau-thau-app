<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tiến độ Đấu thầu ĐTXD-SCL</title>

<!-- ===== CÁC THẺ NÀY LÀ MẤU CHỐT ĐỂ SAFARI/iOS HIỂU ĐÂY LÀ "APP" KHI THÊM VÀO MÀN HÌNH CHÍNH:
     ẩn thanh địa chỉ, chạy toàn màn hình, dùng icon + tên riêng thay vì icon Safari mặc định. ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiến độ ĐT">
<meta name="theme-color" content="#161b27">

<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" href="icons/icon-512.png">
<link rel="manifest" href="manifest.json">

<style>
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#161b27;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none; /* tránh hiệu ứng bounce/giật lố ở rìa trang, nhưng KHÔNG chặn cuộn bên trong iframe */
  }
  /* QUAN TRỌNG: dùng layout flex-column bình thường (KHÔNG position:fixed cho phần nội dung
     chính) — đây là cách tránh lỗi Safari/iOS "nuốt" thao tác vuốt dọc đã sửa trước đó. */
  body{ display:flex; flex-direction:column; }

  /* Dải màu lấp đúng vùng "status bar" (đồng hồ/pin) của iPad — tô cùng màu với header thật
     của app (#161b27, lấy từ styles.html) để liền mạch, không còn cảnh chữ/icon app đè lên
     đồng hồ, pin. viewport-fit=cover + status-bar-style=black-translucent thì env(safe-area-inset-top)
     mới đọc được đúng chiều cao vùng này trên từng dòng iPad/iPhone. */
  #statusbar-fill{
    flex:0 0 auto; width:100%; height:env(safe-area-inset-top); background:#161b27;
  }

  #app-frame{
    flex:1 1 auto; display:block; width:100%; border:none; background:#ffffff;
    opacity:0; transition:opacity .35s ease;
  }
  #app-frame.ready{ opacity:1; }

  /* Màn hình chờ chuyên nghiệp: logo app + vòng xoay nhỏ, mờ dần khi app thật đã tải xong.
     Che luôn cả dải status bar phía trên trong lúc chờ, nên không cần lo thứ tự hiển thị. */
  #boot-msg{
    position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:#ffffff; transition:opacity .35s ease, visibility .35s ease;
  }
  #boot-msg.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #boot-illustration{
    width:min(80vw, 460px); height:auto; display:block;
    animation:bootFloat 3.6s ease-in-out infinite;
  }
  #boot-spinner{
    width:22px; height:22px; border-radius:50%;
    border:3px solid rgba(30,49,89,.12); border-top-color:#1E3159;
    animation:bootSpin .8s linear infinite;
  }
  #boot-text{
    font:600 14.5px/1.5 -apple-system, system-ui, sans-serif; color:#5b6c8f; letter-spacing:.2px;
  }
  @keyframes bootFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @keyframes bootSpin{ to{ transform:rotate(360deg); } }
</style>
</head>

       Trang gốc bên trong (Code.gs / index.html...) KHÔNG hề bị thay đổi gì cả. -->
